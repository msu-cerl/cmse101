baseURL: "http://localhost:1313/"
locale: "en-us"
title: "AI and Society Course"
theme: "terminal"

params:
  # dir name of your main content
  contentTypeName: "posts"
  # Show navigation menu
  showMenuItems: 6
  # center theme with default width
  centerTheme: true
  # if your resource directory contains an image called `cover.(jpg|png|webp)`,
  # then the file will be used as a cover automatically.
  autoCover: true
  # Show metadata
  showLastUpdated: false

  # Accessibility add-on layer (WCAG AAA & UDL compliant)
  a11y:
    enabled: true
    # Validate alt text on images (build-time check)
    enforceAltText: true
    # Enable skip to main content link
    enableSkipNav: true
    # Enable ARIA landmarks
    enableLandmarks: true

languages:
  en:
    label: "English"
    title: "AI and Society Course"
    subtitle: "Exploring the Intersection of AI and Society"
    menuMore: "Show more"
    readMore: "Read more"
    readOtherPosts: "Read other pages"

    params:
      logo:
        logoText: "AI & Society"
        logoHomeLink: "/"

    menu:
      main:
        - identifier: "home"
          name: "Home"
          url: "/"
          weight: 10
        - identifier: "learning-goals"
          name: "Learning Goals"
          url: "/learning-goals/"
          weight: 20
        - identifier: "schedule"
          name: "Schedule"
          url: "/schedule/"
          weight: 30
        - identifier: "readings"
          name: "Readings"
          url: "/readings/"
          weight: 40
        - identifier: "assignments"
          name: "Assignments"
          url: "/assignments/"
          weight: 45
        - identifier: "documentation"
          name: "Documentation"
          url: "/documentation/"
          weight: 50
